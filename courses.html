<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>Caddy Courses</title>
<style>
:root{
  --bg:#f3f5f1;--card:#fff;--text:#18211b;--muted:#647268;--accent:#1f7a4d;--accent-text:#fff;
  --line:#d8dfd9;--soft:#e9efe9;--good:#1f8a4c;--warn:#b7791f;--bad:#c0392b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101410;--card:#1a211b;--text:#e8eee9;--muted:#93a297;--accent:#3fae77;--accent-text:#08140d;
  --line:#2d372f;--soft:#232c25;--good:#4cc27d;--warn:#e0a63c;--bad:#ef6a5b}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0;min-width:0;overflow-wrap:anywhere}
a{color:var(--accent)}
.nav{display:flex;gap:14px;font-size:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meta{margin:4px 0 0;color:var(--muted);font-size:14px}
.chip{flex:none;font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.chip.built{color:var(--good)}.chip.queued,.chip.building{color:var(--warn)}.chip.failed{color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.btn,button{font:inherit;font-size:15px;text-align:center;text-decoration:none;color:var(--text);background:var(--soft);
  border:1px solid var(--line);border-radius:12px;padding:11px 8px;cursor:pointer;touch-action:manipulation;display:block}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent;font-weight:700}
button:disabled{opacity:.45;cursor:default}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.note{margin:12px 0 0;padding-left:10px;border-left:4px solid var(--warn);font-size:14px}
.fail{margin:12px 0 0;padding-left:10px;border-left:4px solid var(--bad);font-size:14px}
.fail pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;margin:8px 0 0;max-height:220px;overflow:auto}
summary{cursor:pointer}
.empty,.msg{text-align:center;padding:28px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);
  color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Courses</h1>
    <nav class="nav"><a href="capture.html">Capture</a><a href="editor.html">Editor</a></nav>
  </header>
  <div id="list" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function token(){
  var t="";try{t=localStorage.getItem("caddy:token")||""}catch(e){}
  if(!t){t=prompt("Enter the caddy password")||"";if(t){try{localStorage.setItem("caddy:token",t)}catch(e){}}}
  return t;
}
/* always resolves to the parsed JSON plus _status (0 = no connection) */
function api(a,body){
  var t=token();
  if(!t)return Promise.resolve({error:"A password is needed.",_status:-1});
  return fetch("api.php?a="+a,{method:body?"POST":"GET",headers:{"X-Token":t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined})
    .then(function(r){
      return r.json().catch(function(){return {error:"Unexpected response from the server."}}).then(function(j){
        if(r.status===401){try{localStorage.removeItem("caddy:token")}catch(e){}}
        j._status=r.status;return j;
      });
    },function(){return {error:"No connection to the server.",_status:0}});
}

var toastT=null;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on")},2600)}

/* server times are plain "YYYY-MM-DD HH:MM:SS" in the server's own clock */
function when(s){
  if(!s)return "";
  var d=new Date(String(s).replace(" ","T"));
  if(isNaN(d))return esc(s);
  return d.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}

var LABEL={draft:"Not built",queued:"Queued",building:"Building",built:"Ready",failed:"Failed"};

function card(c){
  var name=c.name||"Untitled course";
  var busy=c.status==="queued"||c.status==="building";
  var h='<article class="card"><div class="top"><h2>'+esc(name)+'</h2><span class="chip '+esc(c.status)+'">'+esc(LABEL[c.status]||c.status)+'</span></div>';
  h+='<p class="meta">'+c.holes+' hole'+(c.holes===1?'':'s')+'. Edited '+when(c.updated_at)+'.'+(c.built_at?' Last built '+when(c.built_at)+'.':'')+'</p>';

  if(c.links){
    if(c.status==="queued"||c.status==="building")h+='<p class="note">A new build is on the way. These files are from the previous build.</p>';
    else if(c.status==="draft")h+='<p class="note">The course has changed since this build. Build it again to update the files.</p>';
    else if(c.status==="failed")h+='<p class="note">The latest build failed. These files are from the previous build.</p>';
    h+='<div class="files">'+
      '<a class="btn primary" href="'+esc(c.links.print)+'">Print PDF</a>'+
      '<a class="btn primary" href="'+esc(c.links.phone)+'">Phone PDF</a>'+
      '<a class="btn primary" href="'+esc(c.links.web)+'">Web page</a></div>';
  }
  if(c.status==="failed"&&c.build_msg){
    h+='<details class="fail"><summary>Why the build failed</summary><pre>'+esc(c.build_msg)+'</pre></details>';
  }
  var buildLabel=c.status==="failed"?"Try build again":(c.built_at?"Rebuild":"Build book");
  h+='<div class="actions"><a class="btn" href="editor.html#course='+esc(c.id)+'">Edit course</a>'+
     '<button data-build="'+esc(c.id)+'"'+(busy?' disabled':'')+'>'+(busy?esc(LABEL[c.status]):buildLabel)+'</button></div>';
  return h+'</article>';
}

var timer=null;
function render(courses){
  var box=$("list");
  if(!courses.length){
    box.innerHTML='<div class="card empty"><p style="margin:0 0 8px">No courses on the server yet.</p><p class="muted small" style="margin:0">Record a course on the <a href="capture.html">capture page</a>, then tap Save to server on its Data tab.</p></div>';
    return;
  }
  box.innerHTML=courses.map(card).join("");
}
function load(){
  clearTimeout(timer);
  return api("list").then(function(j){
    if(j._status!==200){
      $("list").innerHTML='<div class="card msg"><p style="margin:0 0 12px">'+esc(j.error||"Could not load the courses.")+'</p><button id="retry">Try again</button></div>';
      return;
    }
    render(j.courses);
    // keep refreshing while anything is waiting on the builder
    if(j.courses.some(function(c){return c.status==="queued"||c.status==="building"}))timer=setTimeout(load,8000);
  });
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="retry"){load();return;}
  var id=b.getAttribute("data-build");if(!id)return;
  b.disabled=true;
  api("complete",{id:id}).then(function(j){
    if(j._status===200){toast("Queued. The builder checks every minute.");}
    else toast(j.error||"Could not start the build.");
    load();
  });
});

load();
})();
</script>
</body>
</html>
